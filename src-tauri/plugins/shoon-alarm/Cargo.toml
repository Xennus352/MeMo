[package]
name = "tauri-plugin-shoon-alarm"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Schedules an alarm that wakes MeMo and speaks the reminder aloud (shovels the WAV cache or the device TTS) — even on the lock screen or with the app closed"
license = "MIT"
autobins = false
links = "tauri-plugin-shoon-alarm"

[lib]
name = "tauri_plugin_shoon_alarm"
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
